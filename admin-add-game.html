<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#601929">
  <title>Admin: Add Game - Tri-Valley Baseball Umpires</title>
  <link rel="stylesheet" href="styles.css?v=17" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.trivalleyball.com https://img.shields.io; frame-src https://*.firebaseapp.com https://accounts.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://fcm.googleapis.com https://*.cloudfunctions.net https://*.run.app https://api.open-meteo.com;">
</head>
<body>
  <div class="header">
    <img src="logo.png" alt="Tri-Valley Baseball" class="logo" />
    <h1>Admin Panel</h1>
  </div>

  <nav id="mainNav" aria-label="Main navigation"></nav>

  <div class="container" id="adminContent" style="display:none">

    <nav class="admin-subnav">
      <a href="admin.html">Overview</a>
      <a href="admin-games.html" class="admin-subnav-active">Games</a>
      <a href="admin-scheduler.html">Scheduler</a>
      <a href="admin-teams.html">Teams</a>
      <a href="admin-tournament.html">Tournaments</a>
      <a href="admin-payroll.html">Payroll</a>
      <a href="admin-facilities.html">Facilities</a>
      <a href="admin-sponsors.html">Sponsors</a>
      <a href="admin-callup.html">Call-Ups</a>
      <a href="admin-incidents.html">Incidents</a>
      <a href="admin-alerts.html">Alerts</a>
      <a href="admin-config.html">Config</a>
      <a href="admin-analytics.html">Analytics</a>
      <a href="admin-users.html">Users</a>
    </nav>

    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px">
      <h2 style="margin:0" id="pageTitle">Add Game</h2>
      <a href="admin-games.html" class="btn print-btn">← Back to Games</a>
    </div>

    <div id="makeupBanner" style="display:none" class="document-note" style="border-left-color:#7ec8f7;margin-bottom:16px"></div>

    <form id="addGameForm" class="signup-form">
      <div class="form-row">
        <div class="form-group">
          <label for="gameLeague">League / Program</label>
          <select id="gameLeague">
            <option value="">— None —</option>
          </select>
        </div>
        <div class="form-group">
          <label for="gameCitySelect">City / Town *</label>
          <select id="gameCitySelect">
            <option value="">-- Select city --</option>
            <option value="__custom__">Enter custom city…</option>
          </select>
          <input type="text" id="gameCityCustom" placeholder="e.g. Crooks" style="display:none;margin-top:6px" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="gameDivision">Division</label>
          <select id="gameDivision" required data-org-divisions>
            <option value="">-- Select --</option>
            <option value="10U">10U</option>
            <option value="12U">12U</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="gameDate">Date</label>
          <input type="date" id="gameDate" required />
        </div>
        <div class="form-group">
          <label for="gameTime">Time</label>
          <input type="time" id="gameTime" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="gameType">Game Type</label>
          <select id="gameType" required>
            <option value="Regular">Regular</option>
            <option value="Playoff">Playoff</option>
            <option value="Tournament">Tournament</option>
          </select>
        </div>
        <div class="form-group">
          <label for="gameFacility">Facility</label>
          <select id="gameFacility">
            <option value="">-- None / Other --</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="gameFieldSelect">Field / Location</label>
          <select id="gameFieldSelect" style="display:none"></select>
          <input type="text" id="gameField" placeholder="e.g. NH-North, East" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="gameHomeTeamSelect">Home Team <span style="color:var(--light-text);font-weight:normal">(optional)</span></label>
          <select id="gameHomeTeamSelect">
            <option value="">-- None --</option>
            <option value="__custom__">Enter custom name…</option>
          </select>
          <input type="text" id="gameHomeTeamCustom" placeholder="e.g. Crooks Red" style="display:none;margin-top:6px" />
        </div>
        <div class="form-group">
          <label for="gameAwayTeamSelect">Away Team <span style="color:var(--light-text);font-weight:normal">(optional)</span></label>
          <select id="gameAwayTeamSelect">
            <option value="">-- None --</option>
            <option value="__custom__">Enter custom name…</option>
          </select>
          <input type="text" id="gameAwayTeamCustom" placeholder="e.g. Colton Blue" style="display:none;margin-top:6px" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Umpire Positions &amp; Pay</label>
          <div id="gameUmpireTypes" class="slot-check-table">
            <label><input type="checkbox" value="Plate" /> Plate</label>
            <span></span>
            <input type="number" class="slot-pay-input" data-slot-type="Plate" min="0" step="0.01" placeholder="$" disabled />

            <label><input type="checkbox" value="Field" /> Field</label>
            <span></span>
            <input type="number" class="slot-pay-input" data-slot-type="Field" min="0" step="0.01" placeholder="$" disabled />

            <label><input type="checkbox" value="Extra" /> Extra</label>
            <span></span>
            <input type="number" class="slot-pay-input" data-slot-type="Extra" min="0" step="0.01" placeholder="$" disabled />
          </div>
          <p class="field-error" id="umpireTypesError"></p>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="gameNotes">Notes <span style="color:var(--light-text);font-weight:normal">(optional — visible to umpires)</span></label>
          <textarea id="gameNotes" rows="2" style="width:100%;padding:8px 10px;background:var(--field);color:#eee;border:1px solid #555;border-radius:6px;font-family:inherit;font-size:0.9rem;box-sizing:border-box;resize:vertical" placeholder="Any details umpires should know before the game…"></textarea>
        </div>
      </div>

      <div class="page-actions" style="margin-top:16px">
        <button type="submit" class="btn" id="addGameBtn">Add Game</button>
        <a href="admin-games.html" class="btn print-btn">Cancel</a>
      </div>
      <p id="addGameMessage" class="signup-message" aria-live="polite"></p>
    </form>

  </div>

  <!-- Not-admin fallback -->
  <div class="container" id="noAccess" style="display:none">
    <div class="document-note">
      <p>You do not have administrator access. <a href="index.html">Return to home.</a></p>
    </div>
  </div>

  <div class="footer">
    <p>
      Questions? Post in <a href="https://join.slack.com/t/trivalleybase-tfa3350/shared_invite/zt-3ww1egxv7-rS61yDq0LX_Jfhyr5TrlUA" target="_blank">Umpire Slack</a>
      | <span data-org-text="coordinatorName">Jeff Althoff</span>: <span data-org-text="coordinatorPhone">605-380-0229</span>
    </p>
  </div>

  <script type="module" src="auth.js?v=27"></script>
  <script type="module" src="admin-add-game.js?v=6"></script>
  <script type="module" src="/pwa.js?v=6"></script>
  <script type="module" src="/tabs.js?v=6"></script>
  <script type="module" src="nav.js?v=9"></script>
</body>
</html>
