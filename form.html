<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umpire Rules Acknowledgment</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    .form-container { max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #1a3c6e; }
    label { display: block; margin: 20px 0 8px; font-weight: bold; font-size: 16px; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button, .back-btn { 
      background: #1a3c6e; 
      color: white; 
      padding: 12px 24px; 
      font-size: 16px; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      text-decoration: none;
      display: inline-block;
    }
    button:hover, .back-btn:hover { background: #0f2a4f; }
    .header-actions { text-align: left; margin-bottom: 20px; }
    .section { margin-top: 30px; padding-top: 20px; border-top: 2px solid #eee; }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="header-actions">
      <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <h1>Umpire Rules & Expectations Acknowledgment</h1>

    <div style="background:#f9f9f9; padding:25px; margin:25px 0; border-left:5px solid #1a3c6e; line-height:1.6;">
      <strong>Paste the full rules text from your document here...</strong>
    </div>

    <form id="umpireForm">
      <label>Umpire Full Name *</label>
      <input type="text" id="name" required>

      <label>Umpire Email *</label>
      <input type="email" id="email" required>

      <label>Umpire Phone *</label>
      <input type="tel" id="phone" required>

      <label>Electronic Signature (Type Full Name) *</label>
      <input type="text" id="signature" required>

      <div class="section">
        <h2>Parent / Guardian Information (if applicable)</h2>
        <label>Parent/Guardian Name</label>
        <input type="text" id="parent_name">
        <label>Parent/Guardian Email</label>
        <input type="email" id="parent_email">
        <label>Parent/Guardian Phone</label>
        <input type="tel" id="parent_phone">
      </div>

      <button type="submit">Submit Acknowledgment</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    // Placeholders — will be replaced by GitHub Actions
    emailjs.init("YOUR_PUBLIC_KEY_HERE");

    document.getElementById('umpireForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        signature: document.getElementById('signature').value,
        parent_name: document.getElementById('parent_name').value || "Not provided",
        parent_email: document.getElementById('parent_email').value || "Not provided",
        parent_phone: document.getElementById('parent_phone').value || "Not provided",
        datetime: new Date().toLocaleString('en-US', {timeZone: 'America/Chicago'}),
        slack_link: "https://join.slack.com/t/trivalleybase-tfa3350/shared_invite/zt-3ww1egxv7-rS61yDq0LX_Jfhyr5TrlUA"
      };

      emailjs.send("YOUR_SERVICE_ID_HERE", "YOUR_TEMPLATE_ID_HERE", formData)
        .then(() => {
          alert(`Thank you, ${formData.name}! Your acknowledgment has been recorded.`);
          e.target.reset();
        })
        .catch(err => {
          console.error(err);
          alert("Submission recorded, but email failed. Please contact Jeff.");
        });
    });
  </script>
</body>
</html>
