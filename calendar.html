<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#601929">
  <title>Calendar - Tri-Valley Baseball Umpires</title>
  <link rel="stylesheet" href="styles.css?v=9" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://www.trivalleyball.com https://img.shields.io; frame-src https://*.firebaseapp.com https://accounts.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://fcm.googleapis.com https://*.cloudfunctions.net https://*.run.app https://api.open-meteo.com;">
</head>
<body>
  <div class="header">
    <img src="logo.png" alt="Tri-Valley Baseball" class="logo" />
    <h1>Game Calendar</h1>
  </div>

<nav id="mainNav" aria-label="Main navigation"></nav>

  <div class="container">

    <!-- View tabs + nav -->
    <div class="page-actions" style="justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:8px">
      <div style="display:flex;gap:8px">
        <button class="btn cal-tab-btn filter-active" data-view="month">Month</button>
        <button class="btn print-btn cal-tab-btn" data-view="week">Week</button>
        <button class="btn print-btn cal-tab-btn" data-view="day">Day</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn print-btn" id="calPrev">&larr;</button>
        <span id="calLabel" style="color:white;font-weight:bold;min-width:160px;text-align:center"></span>
        <button class="btn print-btn" id="calNext">&rarr;</button>
        <button class="btn print-btn" id="calToday">Today</button>
      </div>
    </div>
    <!-- My Games filter — shown only to signed-in users -->
    <div style="margin-bottom:16px" id="calMyGamesRow" style="display:none">
      <button class="btn print-btn" id="calMyGamesBtn" data-auth-required style="display:none">All Games</button>
    </div>

    <!-- Calendar display area -->
    <div id="calView"></div>

  </div>

  <div class="footer">
    <p>
      <span data-auth-approved style="display:none">
        Questions? Post in
        <a href="https://join.slack.com/t/trivalleybase-tfa3350/shared_invite/zt-3ww1egxv7-rS61yDq0LX_Jfhyr5TrlUA" target="_blank">Umpire Slack</a>
        | Jeff Althoff: 605-380-0229 (urgent only) |
      </span>
      <a href="https://sdvfwbaseball.com/" target="_blank">SD VFW Baseball</a>
      | <a href="https://www.minndak.org/" target="_blank">Minndak Baseball League</a>
    </p>
  </div>

  <script type="module" src="auth.js?v=11"></script>
  <script type="module" src="calendar.js?v=8"></script>
  <script type="module" src="/pwa.js?v=1"></script>
  <script type="module" src="/tabs.js?v=2"></script>
  <script type="module" src="nav.js?v=1"></script>
</body>
</html>
