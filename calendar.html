<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#601929">
  <title>Calendar - Tri-Valley Baseball Umpires</title>
  <link rel="stylesheet" href="styles.css?v=16" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://www.trivalleyball.com https://img.shields.io; frame-src https://*.firebaseapp.com https://accounts.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://fcm.googleapis.com https://*.cloudfunctions.net https://*.run.app https://api.open-meteo.com;">
</head>
<body>
  <div class="header">
    <img src="logo.png" alt="Tri-Valley Baseball" class="logo" />
    <h1>Game Calendar</h1>
  </div>

  <nav id="mainNav" aria-label="Main navigation"></nav>

  <div class="container">

    <!-- Month nav + view toggle + show checkboxes (all on one row, wrapping) -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px">
        <button type="button" class="btn print-btn" id="calPrev" style="padding:6px 12px">◀</button>
        <span id="calLabel" style="font-weight:bold;font-size:1.1rem;min-width:170px;text-align:center"></span>
        <button type="button" class="btn print-btn" id="calNext" style="padding:6px 12px">▶</button>
        <button type="button" class="btn print-btn" id="calToday" style="padding:6px 10px;font-size:0.85rem">Today</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="cal-view-toggle">
          <button type="button" class="cal-view-btn active" data-view="month">📅 Month</button>
          <button type="button" class="cal-view-btn" data-view="list">☰ List</button>
        </div>
        <label style="display:flex;align-items:center;gap:4px;font-size:0.85rem;cursor:pointer;font-weight:normal">
          <input type="checkbox" id="calShowGames" checked /> Games
        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:0.85rem;cursor:pointer;font-weight:normal">
          <input type="checkbox" id="calShowPractices" checked /> Practices
        </label>
      </div>
    </div>

    <!-- Filter bar -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
      <select id="calFilterDivision" class="gf-select">
        <option value="">All Divisions</option>
      </select>
      <select id="calFilterTown" class="gf-select">
        <option value="">All Towns</option>
      </select>
      <select id="calFilterLeague" class="gf-select" style="display:none">
        <option value="">All Leagues</option>
      </select>
      <select id="calFilterField" class="gf-select">
        <option value="">All Fields</option>
      </select>
      <button type="button" class="btn print-btn" id="calMyGamesBtn" style="display:none">All Games</button>
      <button type="button" class="btn print-btn" id="calFilterReset" style="font-size:0.82rem;padding:5px 10px">✕ Clear</button>
      <span id="calFilterCount" style="font-size:0.8rem;color:var(--light-text)"></span>
    </div>

    <!-- Month view -->
    <div id="calMonthView" style="overflow-x:auto"></div>

    <!-- List view -->
    <div id="calListView" style="display:none"></div>

  </div>

  <div class="footer">
    <p>
      <span data-auth-approved style="display:none">
        Questions? Post in
        <a href="https://join.slack.com/t/trivalleybase-tfa3350/shared_invite/zt-3ww1egxv7-rS61yDq0LX_Jfhyr5TrlUA" target="_blank">Umpire Slack</a>
        | Jeff Althoff: 605-380-0229 (urgent only) |
      </span>
      <a href="https://sdvfwbaseball.com/" target="_blank">SD VFW Baseball</a>
      | <a href="https://www.minndak.org/" target="_blank">Minndak Baseball League</a>
    </p>
  </div>

  <!-- Detail modal -->
  <div id="calDetailModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:1000;align-items:center;justify-content:center;padding:16px">
    <div style="background:var(--container);border-radius:12px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;position:relative">
      <button id="calDetailClose" style="position:absolute;top:10px;right:14px;background:none;border:none;color:var(--light-text);font-size:1.5rem;cursor:pointer;line-height:1;padding:4px" aria-label="Close">×</button>
      <div id="calDetailContent"></div>
    </div>
  </div>

  <script type="module" src="auth.js?v=17"></script>
  <script type="module" src="calendar.js?v=13"></script>
  <script type="module" src="/pwa.js?v=1"></script>
  <script type="module" src="/tabs.js?v=3"></script>
  <script type="module" src="nav.js?v=2"></script>
</body>
</html>
