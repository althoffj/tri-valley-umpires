<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#601929">
  <title>Tournaments - Tri-Valley Baseball</title>
  <link rel="stylesheet" href="styles.css?v=18" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.trivalleyball.com https://img.shields.io; frame-src https://*.firebaseapp.com https://accounts.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://fcm.googleapis.com https://*.cloudfunctions.net https://*.run.app https://api.open-meteo.com;">
</head>
<body>
  <div class="header">
    <img src="logo.png" alt="Tri-Valley Baseball" class="logo" />
    <h1>🏆 Tournaments</h1>
  </div>

  <nav id="mainNav" aria-label="Main navigation"></nav>

  <div class="container">

    <!-- Tournament selector -->
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <select id="tournamentSelect"
        style="flex:1;min-width:220px;max-width:400px;padding:9px 12px;
               background:var(--field);color:var(--text);border:1px solid #555;
               border-radius:6px;font-size:0.95rem">
        <option value="">Loading tournaments…</option>
      </select>
      <div id="tournamentMeta" style="color:var(--light-text);font-size:0.85rem"></div>
    </div>

    <!-- Bracket tabs + view toggle -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      <div id="bracketTabBar" class="cal-view-toggle" style="flex-wrap:wrap;display:none"></div>
      <div class="cal-view-toggle" id="viewToggleBar">
        <button type="button" class="cal-view-btn view-style-btn active" data-style="bracket">🏆 Bracket</button>
        <button type="button" class="cal-view-btn view-style-btn" data-style="list">☰ Games</button>
        <button type="button" class="cal-view-btn view-style-btn" data-style="teams">👕 Teams</button>
      </div>
    </div>

    <!-- Main content area -->
    <div id="tournamentContent">
      <p style="color:var(--light-text);text-align:center;padding:40px 0">Loading…</p>
    </div>

  </div>

  <div class="footer">
    <p>
      <a href="https://sdvfwbaseball.com/" target="_blank">SD VFW Baseball</a>
      | <a href="https://www.minndak.org/" target="_blank">Minndak Baseball League</a>
    </p>
  </div>

  <script type="module" src="auth.js?v=28"></script>
  <script type="module" src="tournament.js?v=28"></script>
  <script type="module" src="/pwa.js?v=6"></script>
  <script type="module" src="/tabs.js?v=6"></script>
  <script type="module" src="nav.js?v=14"></script>
</body>
</html>
